<svg xmlns="http://www.w3.org/2000/svg" width="760" height="374" viewBox="0 0 760 374" role="img" aria-labelledby="title desc">
  <title id="title">npm-ssl-updater dry-run output</title>
  <desc id="desc">Actual CLI output captured with synthetic local Nginx Proxy Manager API fixtures. No network requests are made and no changes are applied.</desc>
  <rect width="100%" height="100%" rx="12" fill="#111827"/>
  <rect width="100%" height="42" rx="12" fill="#1f2937"/>
  <circle cx="22" cy="21" r="6" fill="#f87171"/><circle cx="44" cy="21" r="6" fill="#fbbf24"/><circle cx="66" cy="21" r="6" fill="#34d399"/>
  <text x="380" y="26" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">npm-ssl-updater --block-exploits --enable-websockets --dry-run</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" xml:space="preserve">
    <text x="28" y="80" fill="#e5e7eb"> </text>
    <text x="28" y="104" fill="#e5e7eb">Proxy: app.example.test</text>
    <text x="28" y="128" fill="#e5e7eb"> - ssl_forced               no -&gt; yes</text>
    <text x="28" y="152" fill="#e5e7eb"> - http2_support            no -&gt; yes</text>
    <text x="28" y="176" fill="#e5e7eb"> - hsts_enabled             no -&gt; yes</text>
    <text x="28" y="200" fill="#e5e7eb"> - block_exploits           no -&gt; yes</text>
    <text x="28" y="224" fill="#e5e7eb"> - allow_websocket_upgrade  no -&gt; yes</text>
    <text x="28" y="248" fill="#fbbf24">   Dry-run mode: no changes applied.</text>
    <text x="28" y="272" fill="#e5e7eb"> </text>
    <text x="28" y="296" fill="#e5e7eb">Completed. Updated 0 host(s).</text>
  </g>
  <text x="28" y="354" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Synthetic fixture data · captured from actual CLI · no network access</text>
</svg>
