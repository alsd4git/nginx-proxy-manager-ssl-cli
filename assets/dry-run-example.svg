<svg xmlns="http://www.w3.org/2000/svg" width="900" height="288" viewBox="0 0 900 288" role="img" aria-labelledby="title desc">
  <title id="title">npm-ssl-updater dry-run example</title>
  <desc id="desc">Synthetic terminal output showing proposed security changes for one proxy host. Dry-run applies no changes.</desc>
  <rect width="900" height="288" rx="12" fill="#111827"/>
  <rect width="900" height="40" rx="12" fill="#1f2937"/>
  <circle cx="22" cy="20" r="6" fill="#f87171"/>
  <circle cx="44" cy="20" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="20" r="6" fill="#34d399"/>
  <text x="450" y="25" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">npm-ssl-updater --block-exploits --enable-websockets --dry-run</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <text x="28" y="78" fill="#93c5fd">Proxy:</text><text x="100" y="78" fill="#e5e7eb">example.test</text>
    <text x="48" y="112" fill="#e5e7eb">ssl_forced</text><text x="220" y="112" fill="#fca5a5">no</text><text x="250" y="112" fill="#9ca3af">-&gt;</text><text x="285" y="112" fill="#86efac">yes</text>
    <text x="48" y="140" fill="#e5e7eb">block_exploits</text><text x="220" y="140" fill="#fca5a5">no</text><text x="250" y="140" fill="#9ca3af">-&gt;</text><text x="285" y="140" fill="#86efac">yes</text>
    <text x="48" y="168" fill="#e5e7eb">allow_websocket_upgrade</text><text x="285" y="168" fill="#fca5a5">no</text><text x="315" y="168" fill="#9ca3af">-&gt;</text><text x="350" y="168" fill="#86efac">yes</text>
    <text x="28" y="216" fill="#fbbf24">Dry-run mode: no changes applied.</text>
    <text x="28" y="256" fill="#9ca3af">Illustrative output. Host and values are synthetic.</text>
  </g>
</svg>
