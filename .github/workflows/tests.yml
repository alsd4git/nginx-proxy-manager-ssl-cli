name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  node-20-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Smoke-test packed artifact outside the checkout
        run: |
          ARTIFACT_DIR="$(mktemp -d)"
          npm pack --pack-destination "$ARTIFACT_DIR"
          PREFIX="$(mktemp -d)"
          npm install --global --prefix "$PREFIX" "$ARTIFACT_DIR"/*.tgz
          cd "$PREFIX"
          "$PREFIX/bin/npm-ssl-updater" --help
