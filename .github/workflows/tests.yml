name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke-test packed artifact outside the checkout
        run: |
          ARTIFACT_DIR="$(mktemp -d)"
          npm pack --pack-destination "$ARTIFACT_DIR"
          PREFIX="$(mktemp -d)"
          npm install --global --prefix "$PREFIX" "$ARTIFACT_DIR"/*.tgz
          cd "$PREFIX"
          "$PREFIX/bin/npm-ssl-updater" --help
